name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format
        run: uv run ruff format --check .

      - name: mypy
        # O conftest.py da raiz é checado à parte: o mypy não aceita dois
        # módulos chamados "conftest" na mesma execução.
        run: |
          uv run mypy src tests
          uv run mypy conftest.py

      - name: pyright
        run: uv run pyright

      - name: pytest
        run: uv run pytest
