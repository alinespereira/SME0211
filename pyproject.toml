[project]
name = "bandejao"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aline", email = "line.asramos@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]

[project.scripts]
bandejao = "bandejao:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "mypy>=2.4.1",
    "nbformat>=5.11.1",
    "ruff>=0.17.4",
]
